# IntentContinuum Configuration

# Intent thresholds
intent:
  upper_threshold: 3.0    # seconds - trigger scale UP if response time exceeds this
  lower_threshold: 0.5    # seconds - trigger scale DOWN if response time below this
  ema_alpha: 0.2          # smoothing factor for Exponential Moving Average (ideal-setup: faster detect+recovery)
  check_interval: 5       # seconds between checks
  wait_after_action: 90   # seconds to wait after taking an action (matches ~90s pod-startup/settling; smart_cooldown still exits early on recovery; add_replica handled by warm-gate)
  startup_grace_period_seconds: 30  # skip violation handling for first N seconds (avoids cold-start artefact)

# Warm-up gate after add_replica (prevents the cold-pod cascade — see
# intent_watch_loop._warm_new_replica_until_hot). A freshly added ms3 pod is marked Ready
# 15-30s before its SSD model finishes loading (30-60s); a single LB warm-up usually hits the
# OLD pod. We send several chain warm-ups and resume only once the new pod is provably hot.
warmup:
  warm_threshold_s: 2.0        # a replica is "hot" when a warm-up request returns faster than this
  warm_min_requests_factor: 3  # send >= max(6, factor * replicas) warm-up requests
  warm_max_seconds: 120        # hard cap so a genuinely stuck pod can't hang the loop

# Endpoints
endpoints:
  ollama: "http://10.56.2.204:11434"
  onos: "http://localhost:8181"
  onos_user: "onos"
  onos_password: "rocks"
  sflow_rt: "http://localhost:8008"
  kubernetes_master: "10.56.1.209"
  kubernetes_user: "cc"
  locust: "http://10.56.0.148:8089"

# Application
application:
  entry_point: "http://10.56.1.209:5001/resize"
  sdn_entry_point: "http://192.168.100.100:5001/resize"
  test_image: "/home/cc/OpenLLMIntentContinuum/images/family.jpg"
  remote_test_image: "/home/cc/test_converted.jpg"
  webhooks: "http://microservice2-service:5002/bw,http://microservice3-service:8081/,http://microservice4-service:5004/notify"
  db_url: "http://db-service:5006/track_time"
  logs_url: "http://db-service:5006/log"

# LLM
llm:
  model: "qwen3.5:4b"
  temperature: 0
  max_tokens: 512  # max completion tokens; 200 caused truncation in ablation study exp_02-08
  provider: "ollama"  # "ollama" (default) or "openai"

# Decision History
history:
  max_entries: 5  # Maximum past violations to include in prompt

# Experiment Settings
experiment:
  default_duration_minutes: 30  # Default time window duration

# Actions enabled
actions:
  horizontal_scaling: true
  vertical_scaling: true
  service_placement: true
  flow_scheduling: true

# Kubernetes
kubernetes:
  namespace: "default"
  ssh_user: "cc"
  deployments:
    - name: "microservice1-deployment"
      node: "worker2"   # home node — reset_cluster restores this nodeSelector each run (undoes a service_placement migration)
      min_replicas: 1
      max_replicas: 5
      default_cpu: "500m"
      default_memory: "512Mi"
    - name: "microservice2-deployment"
      node: "worker2"   # Exp13: moved off worker1 to free that node for ms3's elevated regime (was worker1)
      min_replicas: 1
      max_replicas: 5
      default_cpu: "500m"
      default_memory: "512Mi"
    - name: "microservice3-deployment"
      node: "worker1"   # home node — reset_cluster restores this nodeSelector each run (undoes a service_placement migration)
      min_replicas: 2   # warm standby: never drop ms3 below 1 serving pod during a rollout/scale (SSD cold-start safety)
      max_replicas: 3   # Exp13: capped (3×1200m ceiling = 3600m < worker1's 4000m, since ms2 moved to worker2)
      default_cpu: "800m"     # Exp13 elevated regime (was 500m)
      default_memory: "1536Mi"  # Exp13 elevated regime (was 1024Mi)
    - name: "microservice4-deployment"
      node: "worker2"   # home node — reset_cluster restores this nodeSelector each run (undoes a service_placement migration)
      min_replicas: 1
      max_replicas: 3
      default_cpu: "500m"
      default_memory: "512Mi"

# sFlow-RT monitoring configuration
sflow:
  # Node IPs for host-level metrics (CPU, memory, load)
  nodes:
    master: "10.56.1.209"
    worker1: "10.56.1.101"
    worker2: "10.56.3.6"
  # SDN overlay IPs for network bandwidth metrics
  sdn_overlay:
    master: "192.168.100.100"
    worker1: "192.168.100.101"
    worker2: "192.168.100.102"
  # Pod CIDR prefix to identify pod sFlow agents from /agents/json
  pod_cidr: "10.42."