# IntentContinuum Configuration

# Intent thresholds
intent:
  upper_threshold: 3.0    # seconds - trigger scale UP if response time exceeds this
  lower_threshold: 1.0    # seconds - trigger scale DOWN if response time below this
  ema_alpha: 0.1          # smoothing factor for Exponential Moving Average
  check_interval: 5       # seconds between checks
  wait_after_action: 60   # seconds to wait after taking an action

# Endpoints
endpoints:
  ollama: "http://localhost:11434"
  onos: "http://localhost:8181"
  onos_user: "onos"
  onos_password: "rocks"
  sflow_rt: "http://localhost:8008"
  kubernetes_master: "10.132.0.7"
  kubernetes_user: "antonios-icontinuum"
  locust: "http://10.132.0.6:8089"

# Application
application:
  entry_point: "http://10.132.0.7:5001/resize"
  sdn_entry_point: "http://192.168.100.100:5001/resize"
  test_image: "/home/antonios-icontinuum/OpenLLMIntentContinuum/images/family.jpg"
  remote_test_image: "/home/antonios-icontinuum/test_converted.jpg"
  webhooks: "http://microservice2-service:5002/bw,http://microservice3-service:8081/,http://microservice4-service:5004/notify"
  db_url: "http://db-service:5006/track_time"
  logs_url: "http://db-service:5006/log"

# LLM
llm:
  model: "qwen3.5:2b"
  temperature: 0

# Decision History
history:
  max_entries: 5  # Maximum past violations to include in prompt

# Experiment Settings
experiment:
  default_duration_minutes: 30  # Default time window duration

# Actions enabled
actions:
  horizontal_scaling: true
  vertical_scaling: true
  service_placement: false
  flow_scheduling: false

# Kubernetes
kubernetes:
  namespace: "default"
  ssh_user: "antonios-icontinuum"
  deployments:
    - name: "microservice1-deployment"
      min_replicas: 1
      max_replicas: 5
      default_cpu: "300m"
      default_memory: "312Mi"
    - name: "microservice2-deployment"
      min_replicas: 1
      max_replicas: 5
      default_cpu: "300m"
      default_memory: "312Mi"
    - name: "microservice3-deployment"
      min_replicas: 1
      max_replicas: 5
      default_cpu: "500m"
      default_memory: "512Mi"
    - name: "microservice4-deployment"
      min_replicas: 1
      max_replicas: 3
      default_cpu: "300m"
      default_memory: "312Mi"

# sFlow-RT monitoring configuration
sflow:
  # Node IPs for host-level metrics (CPU, memory, load)
  nodes:
    master: "10.132.0.7"
    worker1: "10.132.0.8"
    worker2: "10.132.0.9"
  # SDN overlay IPs for network bandwidth metrics
  sdn_overlay:
    master: "192.168.100.100"
    worker1: "192.168.100.101"
    worker2: "192.168.100.102"
  # Pod CIDR prefix to identify pod sFlow agents from /agents/json
  pod_cidr: "10.42."